<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saved: sewing machine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>:root{--ink:#191917;--serif:"Playfair Display",Georgia,serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}
.box{width:min(80vw,26rem);aspect-ratio:1/1.082}
/* hero sewing machine: line drawing, needle bobs, fabric feeds left, stitches appear behind the needle. CSS transforms only, paused off screen */
.h3-sewbox{aspect-ratio:1/1.082;perspective:none;margin-bottom:2rem}
.sew{display:block;width:100%;height:100%;overflow:visible}
.sew .ln{fill:#fff;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.sew .ln-f{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.sew .thr{fill:none;stroke:var(--ink);stroke-width:1.1;opacity:.6}
.sew .thr2{fill:none;stroke:var(--ink);stroke-width:1;opacity:.6}
.sew .fab{fill:#f2eee6;stroke:rgba(25,25,23,0.35);stroke-width:1}
.sew .st{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 6}
.sew .guide{stroke:rgba(25,25,23,0.25);stroke-width:1;stroke-dasharray:3 4}
.sew .wd{font-family:var(--serif);font-style:italic;font-size:15px;fill:var(--ink)}
.sew-needle{animation:sewNeedle 1.1s ease-in-out infinite}
.sew-tk{transform-box:view-box;transform-origin:113px 232px;animation:sewTk 1.1s ease-in-out infinite}
@keyframes sewTk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.56)}}
.sew-feed{animation:sewFeed 11s linear infinite}
.sew-wheel{transform-box:fill-box;transform-origin:50% 50%;animation:sewSpin 1.1s linear infinite}
.sew-spool{transform-box:fill-box;transform-origin:50% 50%;animation:sewSpool 3.3s ease-in-out infinite alternate}
@keyframes sewNeedle{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes sewFeed{to{transform:translateX(-140px)}}
@keyframes sewSpin{to{transform:rotate(360deg)}}
@keyframes sewSpool{to{transform:scaleY(.94)}}

@media (prefers-reduced-motion:reduce){.sew *{animation:none!important}}
</style></head><body><div class="box"><svg class="sew" viewBox="0 0 400 433" role="img" aria-label="A sewing machine stitching fabric">
<defs><clipPath id="sewBed"><rect x="40" y="320" width="320" height="40"/></clipPath><clipPath id="sewL"><rect x="40" y="320" width="78" height="40"/></clipPath></defs>
<ellipse cx="200" cy="392" rx="168" ry="8" fill="rgba(25,25,23,0.07)"/>
<rect class="ln" x="40" y="350" width="320" height="28" rx="8"/>
<g class="sew-needle"><line class="ln-f" x1="118" y1="200" x2="118" y2="262" style="stroke-width:3"/><rect class="ln" x="110" y="256" width="16" height="10" rx="2"/><line class="ln-f" x1="118" y1="266" x2="118" y2="300" style="stroke-width:2"/><line class="ln-f" x1="118" y1="300" x2="118" y2="326" style="stroke-width:1.2"/><path class="thr2" d="M113 256 V266 L117 305"/><circle cx="118" cy="306" r="1.4" fill="#fff" stroke="#191917" stroke-width=".7"/></g>
<path class="ln" d="M250 350 V205 Q250 196 241 196 H160 Q150 196 150 206 V240 Q150 252 138 252 H98 Q86 252 86 240 V150 Q86 110 126 110 H290 Q330 110 330 150 V350 Z"/>
<g transform="translate(170 153)"><rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="none" stroke="#191917" stroke-width="1.4"/><rect x="-4.4" y="-4.4" width="8.8" height="8.8" transform="rotate(45)" fill="none" stroke="#191917" stroke-width="1" stroke-dasharray="2 1.6"/></g>
<text class="wd" x="186" y="158">simple threads</text>
<g class="sew-wheel"><circle class="ln" cx="330" cy="172" r="24"/><circle class="ln-f" cx="330" cy="172" r="5"/><line class="ln-f" x1="330" y1="152" x2="330" y2="167"/><line class="ln-f" x1="330" y1="177" x2="330" y2="192"/><line class="ln-f" x1="310" y1="172" x2="325" y2="172"/><line class="ln-f" x1="335" y1="172" x2="350" y2="172"/></g>
<line class="ln-f" x1="212" y1="110" x2="212" y2="98"/>
<g class="sew-spool"><rect class="ln" x="199" y="72" width="26" height="26" rx="3"/><line class="ln-f" x1="203" y1="80" x2="221" y2="80"/><line class="ln-f" x1="203" y1="85" x2="221" y2="85"/><line class="ln-f" x1="203" y1="90" x2="221" y2="90"/></g>
<path class="thr" d="M199 85 C160 85 128 92 116 112 C108 126 102 140 100 165 L100 214 L113 230 V232"/><line class="thr sew-tk" x1="113" y1="232" x2="113" y2="257"/><circle class="ln" cx="100" cy="170" r="5"/><path class="ln-f" d="M95 204 h6 a3 3 0 0 1 0 6 h-6"/>
<g clip-path="url(#sewBed)"><g class="sew-feed"><rect class="fab" x="40" y="336" width="460" height="15" rx="2"/><line class="guide" x1="40" y1="343.5" x2="500" y2="343.5"/></g>
<g clip-path="url(#sewL)"><g class="sew-feed"><line class="st" x1="40" y1="343.5" x2="500" y2="343.5"/></g></g></g>
<line class="ln-f" x1="128" y1="252" x2="128" y2="330"/>
<path class="ln" d="M106 330 h28 l3 6 h-34z"/>
</svg></div></body></html>
